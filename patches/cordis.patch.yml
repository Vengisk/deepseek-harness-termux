# cordis.patch.yml — Android/Termux compatibility overrides
# Apply this to your dsh profile to disable plugins that require
# native modules (node-pty) or Linux-specific features (statx).
#
# Usage: place this file at $DSH_HOME/profiles/web/cordis.patch.yml
#        or merge its contents into your existing patch file.

- id: hmr
  disabled: true
- id: subprocess
  disabled: true
- id: bash-sandbox
  disabled: true
- id: permission
  disabled: true